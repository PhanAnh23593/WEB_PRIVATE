<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - BTVN Buổi 11</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <div class="product">
            <h2>Danh sách sản phẩm</h2>
            <div id="list_product" class="grid_product">
                </div>
        </div>

        <div class="cart_section">
            <div class="cart_header">
                <h2>Giỏ hàng <span id="cart_count" class="badge">0</span></h2>
            </div>
            
            <div id="cart_items" class="cart_items">
                </div>

            <div class="cart_footer">
                <div class="total_price">
                    <span>Tổng tiền:</span>
                    <span id="total_money">0 ₫</span>
                </div>
                <button onclick="checkout()" class="btn_checkout">Thanh toán</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
