<!DOCTYPE html>
<html lang="vi">
<head>

    <title>Mini Grade Manager</title>
    <link rel="stylesheet" href="btvn.css">
</head>
<body>

    <div class="container">
        <h2>Nhập điểm sinh viên</h2>

        <button onclick="addStudent()">Thêm vào danh sách</button>
        <div class="list-header">DANH SÁCH LỚP</div>
        <ul id="student-list">
            </ul>
    </div>
