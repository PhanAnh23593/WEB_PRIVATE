<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Grade Manager</title>
    <link rel="stylesheet" href="btvn.css">
</head>
<body>

    <div class="container">
        <h2>Nhập điểm sinh viên</h2>
        
        <input type="text" id="nameInput" placeholder="Nhập tên sinh viên...">
        
        <input type="number" id="scoreInput" placeholder="Điểm số (0-10)..." min="0" max="10">
        
        <button id="addBtn">Thêm vào danh sách</button>

        <div class="label-list">DANH SÁCH LỚP</div>
        
        <ul id="studentList"></ul>
    </div>
    <script src="btvn.js" ></script>
</body>
</html>
